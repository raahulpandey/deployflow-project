define command {
    command_name    check_deployflow_http
    command_line    /usr/lib/nagios/plugins/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$
}

define command {
    command_name    check_deployflow_sla
    command_line    /usr/lib/nagios/plugins/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -s "$ARG3$" -w $ARG4$ -c $ARG5$
}

define host {
    use                     linux-server
    host_name               deployflow-server
    alias                   DeployFlow Production Container
    address                 172.17.0.2
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define service {
    use                     generic-service
    host_name               deployflow-server
    service_description     DeployFlow Web Portal Port 3000
    check_command           check_deployflow_http!3000!/
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               deployflow-server
    service_description     DeployFlow API Health Probe
    check_command           check_deployflow_http!3000!/api/health
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               deployflow-server
    service_description     DeployFlow API SLA and Content Check
    check_command           check_deployflow_sla!3000!/api/health!HARD OK!1.5!3.0
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               deployflow-server
    service_description     DeployFlow Container ICMP Ping
    check_command           check_ping!100.0,20%!500.0,60%
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}
